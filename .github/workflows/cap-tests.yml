name: CAP Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cap/smartlogistics-extension/**"
      - ".github/workflows/cap-tests.yml"
  pull_request:
    paths:
      - "cap/smartlogistics-extension/**"
      - ".github/workflows/cap-tests.yml"

permissions:
  contents: write

jobs:
  test:
    name: Node.js 24 / CAP test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cap/smartlogistics-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cap/smartlogistics-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking dependency fixes
        run: npm audit fix --package-lock-only || true

      - name: Reinstall audited dependency tree
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev || true

      - name: Audit complete dependency tree
        run: npm audit || true

      - name: Run CAP tests
        run: npm test

      - name: Commit audited lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh audited dependency lockfile"
            git push
          fi
